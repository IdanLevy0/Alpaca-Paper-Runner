name: paper-runner
on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub can delay scheduled runs by a few minutes)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: paper-runner      # never two passes at once
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: One runner pass
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TRADING_ENABLED: ${{ vars.TRADING_ENABLED }}
        run: python -m runner.run
      - name: Save state and logs
        if: always()
        run: |
          git config user.name "paper-runner"
          git config user.email "paper-runner@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "runner state" -q && git pull --rebase -q && git push -q)
