name: paper-runner
on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub can delay scheduled runs by a few minutes)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: paper-runner      # never two passes at once
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: One runner pass
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TRADING_ENABLED: ${{ vars.TRADING_ENABLED }}
        run: python -m runner.run
      - name: Stock bot pass (market hours only; exits at once otherwise)
        if: always()
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          STOCKS_ENABLED: ${{ vars.STOCKS_ENABLED }}
        run: python -m stockbot.live
      - name: Daily strategies pass (once a day after 09:35 ET; exits at once otherwise)
        if: always()
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DAILY_ENABLED: ${{ vars.DAILY_ENABLED }}
        run: python -m daily.live
      - name: Save state and logs
        if: always()
        run: |
          git config user.name "paper-runner"
          git config user.email "paper-runner@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -m "runner state" -q
          for i in 1 2 3; do
            git pull --rebase -X theirs -q && git push -q && exit 0
            sleep 5
          done
          exit 1
