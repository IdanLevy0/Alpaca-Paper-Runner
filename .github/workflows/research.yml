name: research
on:
  workflow_dispatch: {}     # run by hand from the Actions tab
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m research.run_research --refresh
      - run: |
          git config user.name "paper-runner"
          git config user.email "paper-runner@users.noreply.github.com"
          git add RESEARCH_REPORT.md research/out/replay.html
          git diff --cached --quiet || (git commit -m "research report" -q && git pull --rebase -q && git push -q)
