name: stockbot-replay
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Trading days to replay"
        default: "21"
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m stockbot.replay ${{ inputs.days }}
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      - run: |
          git config user.name "paper-runner"
          git config user.email "paper-runner@users.noreply.github.com"
          git add state/stocks/replay.json
          git diff --cached --quiet || (git commit -m "stock bot replay" -q && git pull --rebase -q && git push -q)
