name: backtest
on:
  workflow_dispatch: {}     # run by hand from the Actions tab
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m backtest.run_backtest --refresh
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      - run: |
          git config user.name "paper-runner"
          git config user.email "paper-runner@users.noreply.github.com"
          git add BACKTEST_RESULT.md
          git diff --cached --quiet || (git commit -m "backtest result" -q && git pull --rebase -q && git push -q)
